<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>跳繩計數器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161921;
      --card: #1e2230;
      --accent: #00e5a0;
      --accent2: #00b8ff;
      --warn: #ffbe00;
      --danger: #ff4757;
      --text: #e8eaf0;
      --muted: #6b7280;
      --radius: 16px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px 40px;
      gap: 20px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0,229,160,.4);
    }

    /* ── Count display ── */
    .display-wrap {
      position: relative;
      width: min(320px, 90vw);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg { fill: none; stroke: var(--card); stroke-width: 10; }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.4s ease, stroke 0.3s;
    }
    .ring-progress.complete { stroke: var(--warn); }

    .display-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 1;
    }

    .count-number {
      font-size: clamp(72px, 22vw, 120px);
      font-weight: 900;
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 30px rgba(0,229,160,.5);
      transition: color 0.2s, text-shadow 0.2s;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
    }
    .count-number.pending {
      color: var(--warn);
      text-shadow: 0 0 30px rgba(255,190,0,.5);
    }
    .count-number.complete {
      color: var(--warn);
      text-shadow: 0 0 40px rgba(255,190,0,.8);
      animation: pulse 0.6s ease infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.04); }
    }

    .count-label { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }
    .target-hint { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .target-hint span { color: var(--warn); font-weight: 700; }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 24px;
    }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.active  { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 1s step-start infinite; }
    .dot.paused  { background: var(--warn);   box-shadow: 0 0 8px var(--warn); }
    .dot.done    { background: var(--danger);  box-shadow: 0 0 8px var(--danger); }

    @keyframes blink { 50% { opacity: 0.2; } }

    /* ── Volume meter ── */
    .meter-wrap { width: min(320px, 90vw); display: flex; flex-direction: column; gap: 6px; }

    .meter-row { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: var(--muted); }

    .meter-bar-bg { flex: 1; height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; }

    .meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 4px;
      transition: width 0.05s;
    }

    /* ── Settings ── */
    .settings-card {
      width: min(320px, 90vw);
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }

    .setting-row { display: flex; flex-direction: column; gap: 8px; }

    .setting-label { display: flex; justify-content: space-between; font-size: 0.9rem; }
    .setting-label span:last-child { color: var(--accent); font-weight: 700; min-width: 36px; text-align: right; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%; height: 6px;
      border-radius: 3px;
      background: var(--surface);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(0,229,160,.5);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
    }

    .target-input-row { display: flex; gap: 10px; align-items: center; }

    input[type="number"] {
      background: var(--surface);
      border: 1.5px solid var(--muted);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 8px 12px;
      width: 110px;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus { border-color: var(--accent); }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 1; }

    .target-note { font-size: 0.78rem; color: var(--muted); }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 12px; width: min(320px, 90vw); }

    .btn {
      flex: 1;
      padding: 16px 8px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.2s, box-shadow 0.2s;
      letter-spacing: 0.05em;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-start { background: var(--accent); color: #0d0f14; box-shadow: 0 0 20px rgba(0,229,160,.35); }
    .btn-start:not(:disabled):hover { box-shadow: 0 0 28px rgba(0,229,160,.55); }

    .btn-pause { background: var(--warn); color: #0d0f14; box-shadow: 0 0 20px rgba(255,190,0,.3); }
    .btn-pause:not(:disabled):hover { box-shadow: 0 0 28px rgba(255,190,0,.5); }

    .btn-stop  { background: var(--danger); color: #fff; box-shadow: 0 0 20px rgba(255,71,87,.25); }
    .btn-stop:not(:disabled):hover { box-shadow: 0 0 28px rgba(255,71,87,.45); }

    /* ── Error banner ── */
    .error-banner {
      display: none;
      width: min(320px, 90vw);
      background: rgba(255,71,87,.15);
      border: 1px solid rgba(255,71,87,.4);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.85rem;
      color: #ff8a95;
      line-height: 1.6;
      text-align: center;
    }
    .error-banner.visible { display: block; }
    .error-banner a { color: var(--accent2); }

    /* ── Flash overlay ── */
    .flash {
      position: fixed; inset: 0;
      pointer-events: none;
      opacity: 0;
      background: rgba(0,229,160,.12);
      transition: opacity 0.08s;
    }
    .flash.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="flash" id="flash"></div>

  <h1>🪢 跳繩計數器</h1>

  <!-- Main counter ring -->
  <div class="display-wrap">
    <svg class="ring-svg" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="88"/>
      <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="88"
              stroke-dasharray="553" stroke-dashoffset="553"/>
    </svg>
    <div class="display-inner">
      <div class="count-number" id="countDisplay">0</div>
      <div class="count-label">次數</div>
      <div class="target-hint" id="targetHint" style="display:none">
        目標：<span id="targetDisplay">0</span> 次
      </div>
    </div>
  </div>

  <!-- Status indicator -->
  <div class="status-bar">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">待機中，按「開始」並允許麥克風</span>
  </div>

  <!-- Volume meter -->
  <div class="meter-wrap">
    <div class="meter-row">
      <span>音量</span>
      <div class="meter-bar-bg">
        <div class="meter-bar" id="meterBar"></div>
      </div>
      <span id="meterVal">0%</span>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings-card">
    <div class="settings-title">設定</div>

    <div class="setting-row">
      <div class="setting-label">
        <span>靈敏度（觸發閾值）</span>
        <span id="threshLabel">15%</span>
      </div>
      <input type="range" id="threshSlider" min="3" max="60" value="15" step="1">
    </div>

    <div class="setting-row">
      <div class="setting-label">
        <span>目標次數</span>
      </div>
      <div class="target-input-row">
        <input type="number" id="targetInput" min="0" max="9999" value="0" placeholder="0 = 不限">
        <span class="target-note">0 為不限制</span>
      </div>
    </div>
  </div>

  <!-- Control buttons -->
  <div class="btn-row">
    <button class="btn btn-start" id="btnStart">開始</button>
    <button class="btn btn-pause" id="btnPause" disabled>暫停</button>
    <button class="btn btn-stop"  id="btnStop"  disabled>結束</button>
  </div>

  <!-- Inline error message (shown only when mic access fails) -->
  <div class="error-banner" id="errorBanner"></div>

<script>
(function () {
  'use strict';

  // ── DOM refs ─────────────────────────────────────────────────────────
  const countDisplay  = document.getElementById('countDisplay');
  const statusDot     = document.getElementById('statusDot');
  const statusText    = document.getElementById('statusText');
  const meterBar      = document.getElementById('meterBar');
  const meterVal      = document.getElementById('meterVal');
  const threshSlider  = document.getElementById('threshSlider');
  const threshLabel   = document.getElementById('threshLabel');
  const targetInput   = document.getElementById('targetInput');
  const targetHint    = document.getElementById('targetHint');
  const targetDisplay = document.getElementById('targetDisplay');
  const ringProgress  = document.getElementById('ringProgress');
  const flash         = document.getElementById('flash');
  const btnStart      = document.getElementById('btnStart');
  const btnPause      = document.getElementById('btnPause');
  const btnStop       = document.getElementById('btnStop');
  const errorBanner   = document.getElementById('errorBanner');

  const RING_CIRC = 2 * Math.PI * 88; // ≈ 553

  // ── Audio state ───────────────────────────────────────────────────────
  let audioCtx  = null;
  let analyser  = null;
  let micStream = null;
  let rafId     = null;

  // ── Counter state ─────────────────────────────────────────────────────
  let state          = 'idle'; // idle | running | paused | done
  let confirmedCount = 0;
  let hasPending     = false;
  let pendingTimer   = null;
  let lastHitTime    = 0;
  let peakState      = false;
  let targetReached  = false;
  let smoothedRMS    = 0;

  const SILENCE_MS   = 1800; // ms of silence before discarding last hit
  const DEBOUNCE_MS  = 250;  // min ms between registered hits
  const SMOOTH       = 0.25;

  // ── Helpers ───────────────────────────────────────────────────────────
  function getThreshold() { return parseFloat(threshSlider.value) / 100; }

  function getDisplayCount() { return confirmedCount + (hasPending ? 1 : 0); }

  function showError(msg) {
    errorBanner.innerHTML = msg;
    errorBanner.classList.add('visible');
  }

  function clearError() {
    errorBanner.classList.remove('visible');
  }

  // ── Display ───────────────────────────────────────────────────────────
  function refreshDisplay() {
    const n      = getDisplayCount();
    const target = parseInt(targetInput.value, 10) || 0;
    const done   = target > 0 && n >= target;

    countDisplay.textContent = n;
    countDisplay.classList.toggle('pending',  hasPending && !done);
    countDisplay.classList.toggle('complete', done);

    if (target > 0) {
      targetHint.style.display = '';
      targetDisplay.textContent = target;
      const pct = Math.min(n / target, 1);
      ringProgress.style.strokeDashoffset = RING_CIRC * (1 - pct);
      ringProgress.classList.toggle('complete', done);
    } else {
      targetHint.style.display = 'none';
      ringProgress.style.strokeDashoffset = RING_CIRC;
      ringProgress.classList.remove('complete');
    }
  }

  function setStatus(s) {
    statusDot.className = 'dot ' + s;
    const MAP = {
      idle:    '待機中，按「開始」並允許麥克風',
      running: '偵測中…',
      paused:  '已暫停',
      done:    '已結束'
    };
    statusText.textContent = MAP[s] || s;
  }

  function updateButtons() {
    btnStart.disabled = (state === 'running' || state === 'done');
    btnPause.disabled = (state !== 'running');
    btnStop.disabled  = (state === 'idle'    || state === 'done');
    btnStart.textContent = state === 'paused' ? '繼續' : '開始';
  }

  // ── Bell (synthesised) ────────────────────────────────────────────────
  function playBell() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const t   = ctx.currentTime;
      [[880,.5,2.5],[1760,.3,1.8],[2640,.2,1.2],[1174,.25,2.0]].forEach(([f,g,d]) => {
        const osc = ctx.createOscillator();
        const env = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        env.gain.setValueAtTime(g, t);
        env.gain.exponentialRampToValueAtTime(0.001, t + d);
        osc.connect(env);
        env.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + d);
      });
      setTimeout(() => ctx.close(), 3500);
    } catch(e) {}
  }

  function doFlash() {
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 100);
  }

  // ── Hit registration ──────────────────────────────────────────────────
  // Each new hit confirms the previous pending one.
  // If silence > SILENCE_MS, the last pending hit is discarded.
  function scheduleSilenceTimeout() {
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => {
      if (state === 'running' && hasPending) {
        hasPending = false;
        refreshDisplay();
      }
    }, SILENCE_MS);
  }

  function registerHit() {
    const now = Date.now();
    if (now - lastHitTime < DEBOUNCE_MS) return;
    lastHitTime = now;

    if (hasPending) confirmedCount++;
    hasPending = true;

    const target = parseInt(targetInput.value, 10) || 0;
    if (target > 0 && getDisplayCount() >= target && !targetReached) {
      targetReached = true;
      playBell();
    }

    doFlash();
    refreshDisplay();
    scheduleSilenceTimeout();
  }

  function flushPending() {
    clearTimeout(pendingTimer);
    hasPending = false;
  }

  // ── Audio analysis loop ───────────────────────────────────────────────
  function analysisLoop() {
    if (state !== 'running') return;

    const data = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(data);

    let sumSq = 0;
    for (let i = 0; i < data.length; i++) sumSq += data[i] * data[i];
    const rms = Math.sqrt(sumSq / data.length);

    smoothedRMS += SMOOTH * (rms - smoothedRMS);
    const pct = Math.min(smoothedRMS * 400, 100);
    meterBar.style.width  = pct + '%';
    meterVal.textContent  = Math.round(pct) + '%';

    const above = rms > getThreshold();
    if (above && !peakState) registerHit(); // rising edge
    peakState = above;

    rafId = requestAnimationFrame(analysisLoop);
  }

  // ── Mic initialisation ────────────────────────────────────────────────
  async function setupAudio() {
    if (audioCtx) return true;

    // Try progressive constraint degradation for maximum compatibility
    const attempts = [
      { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } },
      { audio: true }
    ];

    let lastErr = null;
    for (const constraint of attempts) {
      try {
        micStream = await navigator.mediaDevices.getUserMedia(constraint);
        audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
        analyser  = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0;
        audioCtx.createMediaStreamSource(micStream).connect(analyser);
        return true;
      } catch (e) {
        lastErr = e;
      }
    }

    return lastErr; // return Error object on failure
  }

  // ── Button: 開始 / 繼續 ───────────────────────────────────────────────
  btnStart.addEventListener('click', async () => {
    clearError();

    if (state === 'idle' || state === 'done') {
      confirmedCount = 0;
      hasPending     = false;
      peakState      = false;
      smoothedRMS    = 0;
      lastHitTime    = 0;
      targetReached  = false;
      clearTimeout(pendingTimer);
      refreshDisplay();
    }

    // Check browser support first
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError(
        '您的瀏覽器不支援麥克風 API。<br>' +
        '請改用 <b>Chrome</b> 或 <b>Safari</b>，' +
        '並確認頁面透過 <b>https://</b> 或 <b>localhost</b> 開啟（不能是 file://）。'
      );
      return;
    }

    if (!audioCtx) {
      btnStart.disabled    = true;
      btnStart.textContent = '請求中…';
      setStatus('idle');

      const result = await setupAudio();
      if (result !== true) {
        // Restore button first
        btnStart.disabled    = false;
        btnStart.textContent = '開始';
        updateButtons();

        const name = result && result.name;
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
          showError(
            '麥克風權限被拒絕。<br>' +
            '請點擊瀏覽器網址列左側的 🔒 或 ⓘ 圖示，<br>' +
            '將麥克風設為「允許」，然後重新整理頁面再試一次。'
          );
        } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
          showError('找不到麥克風裝置，請確認已連接麥克風。');
        } else if (location.protocol === 'file:') {
          showError(
            '從本機 file:// 開啟時，多數瀏覽器會封鎖麥克風。<br>' +
            '請將此檔案放到伺服器（或用 VS Code Live Server、<br>' +
            '<code>python3 -m http.server</code>）再開啟。'
          );
        } else {
          showError('無法啟動麥克風：' + (result && result.message || '未知錯誤') + '。');
        }
        return;
      }
    }

    state = 'running';
    setStatus('running');
    updateButtons();
    rafId = requestAnimationFrame(analysisLoop);
  });

  // ── Button: 暫停 ──────────────────────────────────────────────────────
  btnPause.addEventListener('click', () => {
    if (state !== 'running') return;
    cancelAnimationFrame(rafId);
    flushPending();
    state = 'paused';
    refreshDisplay();
    setStatus('paused');
    updateButtons();
    meterBar.style.width = '0%';
    meterVal.textContent = '0%';
  });

  // ── Button: 結束 ──────────────────────────────────────────────────────
  btnStop.addEventListener('click', () => {
    if (state === 'idle') return;
    cancelAnimationFrame(rafId);
    flushPending();
    state = 'done';
    peakState   = false;
    smoothedRMS = 0;
    refreshDisplay();
    setStatus('done');
    updateButtons();
    meterBar.style.width = '0%';
    meterVal.textContent = '0%';
  });

  // ── Slider ────────────────────────────────────────────────────────────
  threshSlider.addEventListener('input', () => {
    threshLabel.textContent = threshSlider.value + '%';
  });

  // ── Target input ──────────────────────────────────────────────────────
  targetInput.addEventListener('input', () => {
    targetReached = false;
    refreshDisplay();
  });

  // ── Init ──────────────────────────────────────────────────────────────
  setStatus('idle');
  updateButtons();
  refreshDisplay();
})();
</script>
</body>
</html>
